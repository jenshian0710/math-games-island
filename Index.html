<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學島｜3D 挑戰地圖</title>
  <style>
    :root { --ink:#102f45; --ocean-1:#092c52; --ocean-2:#0d6e97; --gold:#ffd76c; --paper:#fffdf0; --shadow:rgba(0,18,38,.42); }
    * { box-sizing:border-box; }
    html { background:var(--ocean-1); }
    body { min-width:320px; min-height:100vh; margin:0; overflow-x:hidden; color:#f6fbff; font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; background:radial-gradient(ellipse at 50% -24%,#348eb3 0%,transparent 49%),radial-gradient(circle at 15% 55%,rgba(102,220,231,.16) 0 1px,transparent 2px) 0 0 / 20px 20px,linear-gradient(154deg,#0b3158,#0c658b 58%,#07345e); }
    .page { width:min(1320px,calc(100% - 28px)); margin:0 auto; padding:clamp(18px,3vw,36px) 0 38px; }
    .hero { display:flex; align-items:end; justify-content:space-between; gap:18px; margin:0 auto 18px; }
    .eyebrow { margin:0 0 5px; color:#93eff3; font-size:.8rem; font-weight:800; letter-spacing:.18em; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.45rem); letter-spacing:.055em; line-height:1.08; text-shadow:0 3px 0 rgba(0,0,0,.2); }
    .intro { max-width:670px; margin:10px 0 0; color:#d3edf5; font-weight:600; line-height:1.6; }
    .view-button { flex:0 0 auto; border:1px solid rgba(211,250,255,.6); border-radius:999px; padding:11px 15px; color:#f5ffff; background:rgba(9,48,78,.72); box-shadow:0 7px 17px rgba(0,0,0,.2); font:inherit; font-weight:800; cursor:pointer; }
    .view-button:hover,.view-button:focus-visible { background:#117fa4; outline:3px solid rgba(255,255,255,.9); outline-offset:3px; }
    .map-shell { position:relative; min-height:min(790px,calc(100vh - 180px)); padding:clamp(12px,2.5vw,28px); overflow:hidden; border:1px solid rgba(164,237,244,.55); border-radius:34px; background:radial-gradient(ellipse at 50% 43%,#2785a7 0%,#0b4c75 62%,#082b50 100%); box-shadow:0 24px 55px var(--shadow),inset 0 0 60px rgba(127,238,239,.14); perspective:1400px; }
    .map-shell::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.42; background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 20px,rgba(130,242,248,.18) 21px 22px,transparent 23px 43px); }
    .world-layer { position:relative; z-index:1; width:100%; min-height:700px; aspect-ratio:16 / 9.25; transform-style:preserve-3d; transform-origin:50% 57%; transition:transform .72s cubic-bezier(.2,.8,.2,1),filter .72s ease; }
    .is-angled .world-layer { transform:rotateX(12deg) rotateZ(-.7deg) translateY(-3px); filter:drop-shadow(0 28px 14px rgba(0,17,37,.4)); }
    .terrain { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .terrain text { font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; }
    .region-label { fill:#10364a; font-size:18px; font-weight:900; letter-spacing:4px; paint-order:stroke; stroke:rgba(255,255,237,.64); stroke-width:4px; stroke-linejoin:round; }
    .region-subtitle { fill:#315a62; font-size:12px; font-weight:700; letter-spacing:1.5px; paint-order:stroke; stroke:rgba(255,255,237,.6); stroke-width:3px; }
    .challenge-nav { position:absolute; inset:0; z-index:2; transform-style:preserve-3d; }
    .challenge { --accent:#ffe278; position:absolute; display:grid; grid-template-columns:29px minmax(110px,1fr); align-items:center; gap:8px; width:min(210px,20%); padding:7px 9px 7px 7px; color:#173345; text-decoration:none; background:rgba(255,254,239,.94); border:2px solid rgba(255,255,255,.94); border-radius:13px; box-shadow:0 7px 0 rgba(11,55,71,.38),0 12px 18px rgba(0,27,42,.24); transform:translate(-50%,-50%) translateZ(28px); transition:transform .18s ease,box-shadow .18s ease,background .18s ease; isolation:isolate; }
    .challenge::before { content:""; position:absolute; z-index:-1; left:14px; bottom:-20px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:20px solid rgba(255,254,239,.94); }
    .challenge:hover,.challenge:focus-visible { background:#fff; transform:translate(-50%,calc(-50% - 10px)) translateZ(48px) scale(1.035); box-shadow:0 13px 0 rgba(11,55,71,.35),0 20px 26px rgba(0,27,42,.3); outline:none; }
    .challenge:focus-visible { outline:4px solid var(--accent); outline-offset:3px; }
    .pin { display:grid; place-items:center; width:29px; height:29px; border-radius:50% 50% 50% 0; background:var(--accent); color:#23425a; font-size:1rem; transform:rotate(-45deg); box-shadow:0 2px 0 rgba(83,54,18,.28); }
    .pin span { transform:rotate(45deg); }
    .challenge b { display:block; font-size:clamp(.78rem,1.4vw,.98rem); line-height:1.2; }
    .challenge small { display:block; margin-top:2px; color:#537180; font-size:.7rem; font-weight:700; line-height:1.25; }
    .mountain { --accent:#d9edff; }.jungle { --accent:#b9e875; }.desert { --accent:#ffe08a; }.lake { --accent:#9be9fb; }
    .cube { left:28%; top:19%; }.square { left:46%; top:13%; }.tower { left:64%; top:24%; }.sheep { left:79%; top:45%; }.memory { left:72%; top:63%; }.number-link { left:56%; top:59%; }.pento { left:42%; top:79%; }.naval { left:62%; top:82%; }.bubble { left:21%; top:63%; }.boat { left:24%; top:42%; }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 15px; margin:17px 0 0; color:#d4eef4; font-size:.85rem; font-weight:700; }.legend span::before { content:""; display:inline-block; width:9px; height:9px; margin-right:5px; border-radius:50%; background:currentColor; }.legend .mountain-key { color:#d9edff; }.legend .jungle-key { color:#b9e875; }.legend .desert-key { color:#ffe08a; }.legend .lake-key { color:#9be9fb; }
    .assist { position:absolute; left:18px; bottom:14px; z-index:4; margin:0; padding:7px 10px; border-radius:9px; color:rgba(238,255,255,.88); background:rgba(5,46,74,.67); font-size:.75rem; font-weight:700; }
    @media (max-width:840px) { .hero { align-items:start; flex-direction:column; }.view-button { align-self:flex-start; }.map-shell { min-height:0; }.world-layer { min-height:640px; aspect-ratio:auto; }.challenge { width:min(183px,26%); }.challenge small { display:none; }.cube { left:22%; top:16%; }.square { left:48%; top:10%; }.tower { left:74%; top:19%; }.boat { left:16%; top:42%; }.bubble { left:19%; top:65%; }.number-link { left:55%; top:57%; }.sheep { left:82%; top:42%; }.memory { left:75%; top:63%; }.pento { left:38%; top:82%; }.naval { left:64%; top:85%; } }
    @media (max-width:560px) { .page { width:min(100% - 18px,1320px); }.map-shell { border-radius:23px; padding:9px; }.world-layer { min-height:758px; }.is-angled .world-layer { transform:none; }.region-label { font-size:14px; }.region-subtitle { font-size:10px; }.challenge { grid-template-columns:25px minmax(0,1fr); width:min(144px,35%); min-height:48px; padding:6px; gap:6px; border-radius:10px; }.pin { width:25px; height:25px; font-size:.85rem; }.challenge b { font-size:.73rem; }.challenge::before { left:10px; }.cube { left:21%; top:16%; }.square { left:49%; top:9%; }.tower { left:78%; top:19%; }.boat { left:16%; top:42%; }.bubble { left:18%; top:64%; }.number-link { left:53%; top:59%; }.sheep { left:80%; top:43%; }.memory { left:75%; top:65%; }.pento { left:36%; top:83%; }.naval { left:68%; top:85%; }.assist { display:none; } }
    @media (prefers-reduced-motion:reduce) { .world-layer,.challenge { transition:none; } }
  </style>

  <script>
    const shell = document.getElementById('map-shell');
    const toggle = document.getElementById('view-toggle');
    const help = document.getElementById('map-help');
    toggle.addEventListener('click', () => {
      const angled = shell.classList.toggle('is-angled');
      toggle.setAttribute('aria-pressed', String(angled));
      toggle.textContent = angled ? '⤢ 切換為正視地圖' : '◫ 切換為立體視角';
      help.textContent = angled ? '立體視角已開啟・點選地標即可挑戰' : '正視地圖已開啟・點選地標即可挑戰';
    });
  </script>
