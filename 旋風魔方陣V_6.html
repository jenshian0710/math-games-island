        // PRNG 演算法，保證指定題每次產生結果一致
        function createPRNG(seed) {
            return function() {
                var t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        const workerCode = `
            self.onmessage = function(e) {
                const { N, slots, matrices } = e.data;
                const dominoes = [];
                for(let i=0; i<=6; i++) {
                    for(let j=i; j<=6; j++) {
                        dominoes.push([i, j]);
                    }
                }
                
                let count = 0;
                let iterations = 0;
                const MAX_ITERATIONS = 5000000;
                let isExact = true;
                
                const assigned = {};
                const used = new Array(28).fill(false);
                const foundSets = new Set();
                
                function getGeomHash(boardState) {
                    let hashVars = matrices.map(mat => {
                        const getVal = (sId) => boardState[sId] ? \`\${boardState[sId][0]}-\${boardState[sId][1]}\` : "X";
                        return [getVal(mat.top), getVal(mat.right), getVal(mat.bottom), getVal(mat.left)];
                    });
                    const allPerms = [];
                    for(let rot=0; rot<4; rot++) {
                        let curVars = hashVars.map(v => [...v]);
                        if(rot > 0) curVars = curVars.map(v => [v[3], v[0], v[1], v[2]]);
                        allPerms.push(curVars.map(v=>v.join('|')).sort().join('||'));
                        
                        let flippedVars = curVars.map(v => [v[0], v[3], v[2], v[1]]);
                        allPerms.push(flippedVars.map(v=>v.join('|')).sort().join('||'));
                    }
                    allPerms.sort();
                    return allPerms[0];
                }

                function isValid(currentAssigned) {
                    for (let mat of matrices) {
                        const T = currentAssigned[mat.top], R = currentAssigned[mat.right], B = currentAssigned[mat.bottom], L = currentAssigned[mat.left];
                        const sumT = (T ? T[0] + T[1] : 0) + (R ? R[0] : 0);
                        const sumR = (R ? R[0] + R[1] : 0) + (B ? B[1] : 0);
                        const sumB = (B ? B[0] + B[1] : 0) + (L ? L[1] : 0);
                        const sumL = (L ? L[0] + L[1] : 0) + (T ? T[0] : 0);
                        if (T && R && sumT !== N) return false;
                        if (R && B && sumR !== N) return false;
                        if (B && L && sumB !== N) return false;
                        if (L && T && sumL !== N) return false;
                        if (sumT > N || sumR > N || sumB > N || sumL > N) return false;
                    }
                    return true;
                }
                
                function dfs(slotIdx) {
                    if (iterations++ > MAX_ITERATIONS) { isExact = false; return; }
                    
                    if (iterations % 100000 === 0) {
                        self.postMessage({ type: 'progress', iters: iterations });
                    }

                    if (slotIdx === slots.length) {
                        const geomHash = getGeomHash(assigned);
                        if(!foundSets.has(geomHash)) {
                            foundSets.add(geomHash);
                            count++;
                        }
                        return;
                    }
                    
                    const slotId = slots[slotIdx].id;
                    for (let i = 0; i < 28; i++) {
                        if (used[i]) continue;
                        const dom = dominoes[i];
                        
                        assigned[slotId] = [dom[0], dom[1]];
                        if (isValid(assigned)) {
                            used[i] = true;
                            dfs(slotIdx + 1);
                            used[i] = false;
                        }
                        if (!isExact) return;
                        
                        if (dom[0] !== dom[1]) {
                            assigned[slotId] = [dom[1], dom[0]];
                            if (isValid(assigned)) {
                                used[i] = true;
                                dfs(slotIdx + 1);
                                used[i] = false;
                            }
                            if (!isExact) return;
                        }
                        delete assigned[slotId];
                    }
                }
                
                dfs(0);
                self.postMessage({ type: 'done', count, isExact });
            };
        `;

        function generateGameData(level, mode = 'free') {
            const config = LEVEL_CONFIGS[level];
            const slots = config.slots;
            const matrices = config.matrices;
            let seedOffset = 0;

            while (true) {
                // 產生 PRNG
                let prng = mode === 'free' ? Math.random : createPRNG(level * 100 + mode * 10 + seedOffset);
                
                // 動態決定嘗試的 N 順序，避免寫死 N 導致無解而造成系統當機
                let possibleNs = [8, 9, 10, 11, 12, 13];
                if (mode !== 'free') {
                    for (let i = possibleNs.length - 1; i > 0; i--) {
                        const j = Math.floor(prng() * (i + 1));
                        [possibleNs[i], possibleNs[j]] = [possibleNs[j], possibleNs[i]];
                    }
                } else {
                    possibleNs.sort(() => Math.random() - 0.5);
                }

                for (let targetN of possibleNs) {
                    const assigned = {};
                    let iters = 0;

                    function backtrack(slotIdx) {
                        if (iters++ > 30000) return false; 

                        if (slotIdx === slots.length) {
                            for (let mat of matrices) {
                                const T = assigned[mat.top], R = assigned[mat.right], B = assigned[mat.bottom], L = assigned[mat.left];
                                if ((T[0] + T[1] + R[0] !== targetN) || (R[0] + R[1] + B[1] !== targetN) || (B[1] + B[0] + L[1] !== targetN) || (L[1] + L[0] + T[0] !== targetN)) return false;
                            }
                            const hashSet = new Set(slots.map(s => Math.min(assigned[s.id][0], assigned[s.id][1]) + "-" + Math.max(assigned[s.id][0], assigned[s.id][1])));
                            return hashSet.size === slots.length;
                        }
                        
                        const slotId = slots[slotIdx].id;
                        const pairs = [];
                        for (let v1 = 0; v1 <= 6; v1++) for (let v2 = 0; v2 <= 6; v2++) pairs.push([v1, v2]);
                        
                        // Fisher-Yates 洗牌
                        for (let i = pairs.length - 1; i > 0; i--) {
                            const j = Math.floor(prng() * (i + 1));
                            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
                        }

                        for (let pair of pairs) {
                            const currentHash = Math.min(pair[0], pair[1]) + "-" + Math.max(pair[0], pair[1]);
                            let isDuplicate = false;
                            for (let prevIdx = 0; prevIdx < slotIdx; prevIdx++) {
                                const prevVal = assigned[slots[prevIdx].id];
                                if (Math.min(prevVal[0], prevVal[1]) + "-" + Math.max(prevVal[0], prevVal[1]) === currentHash) { isDuplicate = true; break; }
                            }
                            if (isDuplicate) continue;

                            assigned[slotId] = pair;
                            let prunes = false;
                            for (let mat of matrices) {
                                const T = assigned[mat.top], R = assigned[mat.right], B = assigned[mat.bottom], L = assigned[mat.left];
                                if (T && R && (T[0] + T[1] + R[0] !== targetN)) { prunes = true; break; }
                                if (R && B && (R[0] + R[1] + B[1] !== targetN)) { prunes = true; break; }
                                if (B && L && (B[1] + B[0] + L[1] !== targetN)) { prunes = true; break; }
                                if (L && T && (L[1] + L[0] + T[0] !== targetN)) { prunes = true; break; }
                            }
                            if (!prunes && backtrack(slotIdx + 1)) return true;
                            delete assigned[slotId];
                        }
                        return false;
                    }

                    if (backtrack(0)) return { targetN, solutionMapping: assigned };
                }
                
                // 若指定的 seed 洗牌後，所有的 N 在 30000 步內都搜不到解，自動換 seed 重算
                if (mode !== 'free') {
                    seedOffset++; 
                }
            }
        }

        const MiniBoard = ({ record, config }) => {
            if (!record || !config) return null;
            return (
                <div className={`grid ${config.gridSizeClass} gap-0.5 p-1 bg-slate-100 rounded-lg border border-slate-300 w-full max-w-[280px] mx-auto shadow-sm`} style={{ aspectRatio: config.gridStyle.aspectRatio }}>
                    {config.slots.map(s => {
                        const slot = record.board[s.id];
                        const dom = record.inventory.find(d => d.id === slot?.id);
                        if (!dom) return <div key={s.id} className={`${s.r} bg-white/50 rounded-sm border border-dashed border-slate-200`}></div>;
                        const v1 = slot.flipped ? dom.v2 : dom.v1;
                        const v2 = slot.flipped ? dom.v1 : dom.v2;
                        return (
                            <div key={s.id} className={`${s.r} flex ${s.isV ? 'flex-col' : 'flex-row'} bg-slate-800 text-white rounded-[2px] overflow-hidden text-xs font-black border border-slate-900`}>
                                <div className={`flex-1 flex items-center justify-center ${s.isV ? 'border-b border-slate-600' : 'border-r border-slate-600'}`}>{v1}</div>
                                <div className="flex-1 flex items-center justify-center">{v2}</div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        function App() {
            const [currentLevel, setCurrentLevel] = useState(2);
            const [challengeMode, setChallengeMode] = useState(1); 
            const [isOpenMode, setIsOpenMode] = useState(false);
            const [gameState, setGameState] = useState(null);
            const [studentInfo, setStudentInfo] = useState({ name: "", className: "", number: "" });
            
            const [isTouchDevice, setIsTouchDevice] = useState(false);
            const [dragOverSlot, setDragOverSlot] = useState(null);
            const [selectedBoardSlot, setSelectedBoardSlot] = useState(null); 

            const [timer, setTimer] = useState(0);
            const [steps, setSteps] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            
            const [isHideTimerForExport, setIsHideTimerForExport] = useState(false);
            const [showEmptyForExport, setShowEmptyForExport] = useState(false);
            const [certBtnText, setCertBtnText] = useState("🏅 下載過關榮譽證書");
            
            const [foundSolutions, setFoundSolutions] = useState(new Set());
            const [collectedRecords, setCollectedRecords] = useState([]);
            const [isNewSolutionFound, setIsNewSolutionFound] = useState(false);
            const [leaderboard, setLeaderboard] = useState([]);
            const [totalSolutionsInfo, setTotalSolutionsInfo] = useState({ calculating: false, count: 0, isExact: true, iters: 0 });
            const [praiseText, setPraiseText] = useState("");
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            
            const [filterLevel, setFilterLevel] = useState("all");
            const [filterMode, setFilterMode] = useState("all");

            const printRef = useRef(null);
            const certRef = useRef(null);
            const workerRef = useRef(null);

            const config = useMemo(() => LEVEL_CONFIGS[currentLevel], [currentLevel]);
            
            // 🌟 核心修正：針對不同階數，動態調整字體、間距與邊框，解決五階十字擁擠與重疊的問題
            const uiStyles = useMemo(() => {
                if (currentLevel === 5) return { 
                    text: "text-base sm:text-lg", border: "border-[2px]", gap: "gap-0.5", rounded: "rounded-md",
                    centerText: "text-[10px] sm:text-xs", centerMargin: "m-0.5", emptyText: "text-[10px] sm:text-xs",
                    slotPadding: "p-0.5", ring: "ring-2", scale: "scale-[1.03]"
                };
                if (currentLevel === 4 || currentLevel === 3 || currentLevel === 6) return { 
                    text: "text-lg sm:text-xl", border: "border-2 sm:border-[3px]", gap: "gap-1", rounded: "rounded-lg",
                    centerText: "text-[10px] sm:text-xs", centerMargin: "m-1", emptyText: "text-[10px] sm:text-xs",
                    slotPadding: "p-0.5 sm:p-1", ring: "ring-[3px]", scale: "scale-105"
                };
                return { 
                    text: "text-xl sm:text-2xl", border: "border-[3px]", gap: "gap-1.5", rounded: "rounded-xl",
                    centerText: "text-xs", centerMargin: "m-1", emptyText: "text-sm",
                    slotPadding: "p-1", ring: "ring-[4px]", scale: "scale-105"
                };
            }, [currentLevel]);
            
            const isPlaying = timerActive || steps > 0 || timer > 0;
            const showHeader = !isPlaying || showEmptyForExport;

            useEffect(() => {
                const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
                setIsTouchDevice(isTouch);

                let interval = null;
                if (timerActive && gameState && !gameState.won) {
                    interval = setInterval(() => setTimer(t => t + 1), 1000);
                } else if (!timerActive && timer !== 0) {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [timerActive, gameState?.won]);

            useEffect(() => { 
                const saved = localStorage.getItem('whirlwindLeaderboard');
                if (saved) setLeaderboard(JSON.parse(saved));
            }, []);

            const startCalculateTotalWorker = (targetN) => {
                if (workerRef.current) workerRef.current.terminate();
                setTotalSolutionsInfo({ calculating: true, count: 0, isExact: true, iters: 0 });

                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));
                workerRef.current = worker;

                worker.postMessage({ N: targetN, slots: config.slots, matrices: config.matrices });

                worker.onmessage = (e) => {
                    if (e.data.type === 'progress') {
                        setTotalSolutionsInfo(prev => ({ ...prev, iters: e.data.iters }));
                    } else if (e.data.type === 'done') {
                        setTotalSolutionsInfo({ calculating: false, count: e.data.count, isExact: e.data.isExact, iters: 0 });
                    }
                };
            };

            const initGame = (level = currentLevel, openMode = isOpenMode, preserveFound = false, mode = challengeMode) => {
                const { targetN, solutionMapping } = generateGameData(level, mode);
                
                let newInventory = [];
                if (openMode) {
                    let idCounter = 0;
                    for (let i = 0; i <= 6; i++) {
                        for (let j = i; j <= 6; j++) {
                            newInventory.push({ id: `full-dom-${idCounter++}`, v1: i, v2: j });
                        }
                    }
                } else {
                    newInventory = config.slots.map((s, idx) => ({
                        id: `dom-${idx}`, v1: solutionMapping[s.id][0], v2: solutionMapping[s.id][1]
                    }));
                }
                
                if (mode !== 'free') {
                    const prng = createPRNG(level * 333 + mode * 77);
                    for (let i = newInventory.length - 1; i > 0; i--) {
                        const j = Math.floor(prng() * (i + 1));
                        [newInventory[i], newInventory[j]] = [newInventory[j], newInventory[i]];
                    }
                } else {
                    newInventory.sort(() => Math.random() - 0.5);
                }
                
                const board = {};
                LEVEL_CONFIGS[level].slots.forEach(s => { board[s.id] = null; });

                setGameState({ N: targetN, inventory: newInventory, board, solutionMapping, selectedId: null, won: false, hintCount: 0 });
                setTimer(0);
                setSteps(0);
                setPraiseText("");
                setTimerActive(false);
                setSelectedBoardSlot(null);

                if (!preserveFound) {
                    setFoundSolutions(new Set());
                    setCollectedRecords([]);
                    setIsNewSolutionFound(false);
                }

                if (openMode && !preserveFound) {
                    startCalculateTotalWorker(targetN);
                }
            };

            useEffect(() => { initGame(currentLevel, isOpenMode, false, challengeMode); return () => { if(workerRef.current) workerRef.current.terminate(); }; }, [currentLevel]);

            const triggerStartAction = () => {
                if (!timerActive && gameState && !gameState.won) {
                    setTimerActive(true);
                }
            };

            const getGeomHashMain = (currentBoard, currentInventory, configMats) => {
                let hashVars = configMats.map(mat => {
                    const getVal = (sId) => {
                        const slot = currentBoard[sId];
                        if (!slot) return "X";
                        const dom = currentInventory.find(d => d.id === slot.id);
                        if (!dom) return "X";
                        return slot.flipped ? `${dom.v2}-${dom.v1}` : `${dom.v1}-${dom.v2}`;
                    };
                    return [getVal(mat.top), getVal(mat.right), getVal(mat.bottom), getVal(mat.left)];
                });
                
                const allPerms = [];
                for(let rot=0; rot<4; rot++) {
                    let curVars = hashVars.map(v => [...v]);
                    if(rot > 0) curVars = curVars.map(v => [v[3], v[0], v[1], v[2]]);
                    allPerms.push(curVars.map(v=>v.join('|')).sort().join('||'));
                    let flippedVars = curVars.map(v => [v[0], v[3], v[2], v[1]]);
                    allPerms.push(flippedVars.map(v=>v.join('|')).sort().join('||'));
                }
                allPerms.sort();
                return allPerms[0];
            };

            const getSlotValue = (boardState, slotId, index) => {
                const slot = boardState[slotId];
                if (!slot) return 0;
                const dom = gameState.inventory.find(d => d.id === slot.id);
                if (!dom) return 0;
                return slot.flipped ? (index === 0 ? dom.v2 : dom.v1) : (index === 0 ? dom.v1 : dom.v2);
            };

            const checkVictory = (prevState, currentBoard) => {
                let allMatricesMatch = true;
                for (let mat of config.matrices) {
                    const T1 = getSlotValue(currentBoard, mat.top, 0), T2 = getSlotValue(currentBoard, mat.top, 1);
                    const R1 = getSlotValue(currentBoard, mat.right, 0), R2 = getSlotValue(currentBoard, mat.right, 1);
                    const B1 = getSlotValue(currentBoard, mat.bottom, 0), B2 = getSlotValue(currentBoard, mat.bottom, 1);
                    const L1 = getSlotValue(currentBoard, mat.left, 0), L2 = getSlotValue(currentBoard, mat.left, 1);

                    const sumTop = T1 + T2 + R1, sumRight = R1 + R2 + B2;
                    const sumBottom = B2 + B1 + L2, sumLeft = L2 + L1 + T1;

                    const isFull = currentBoard[mat.top] && currentBoard[mat.right] && currentBoard[mat.bottom] && currentBoard[mat.left];
                    if (!isFull || sumTop !== prevState.N || sumRight !== prevState.N || sumBottom !== prevState.N || sumLeft !== prevState.N) {
                        allMatricesMatch = false; break;
                    }
                }
                const totalFilled = Object.values(currentBoard).filter(v => v !== null).length;
                const isWon = allMatricesMatch && totalFilled === config.slots.length;

                if (isWon && !prevState.won) {
                    const praises = ["🎉 太神啦！完美通關！", "🔥 燃燒吧大腦！順利解開！", "🧠 邏輯滿分！你做到了！", "✨ 太厲害了！精彩的佈局！", "🏅 不可思議！成功破解！"];
                    setPraiseText(praises[Math.floor(Math.random() * praises.length)]);
                    setTimerActive(false);
                    setSelectedBoardSlot(null);

                    const modePrefix = challengeMode === 'free' ? "自由隨機" : `指定題 ${challengeMode}`;
                    const modeLabel = `${modePrefix} (${isOpenMode ? "開放" : "封閉"})`;
                    
                    if (isOpenMode) {
                        const hash = getGeomHashMain(currentBoard, prevState.inventory, config.matrices);
                        if (!foundSolutions.has(hash)) {
                            setFoundSolutions(prev => new Set(prev).add(hash));
                            setCollectedRecords(prev => [...prev, { 
                                board: currentBoard, 
                                inventory: prevState.inventory, 
                                level: currentLevel, 
                                N: prevState.N, 
                                steps: steps + 1, 
                                time: timer,
                                hintCount: prevState.hintCount
                            }]);
                            setIsNewSolutionFound(true);
                        } else {
                            setIsNewSolutionFound(false);
                        }
                    }

                    const newRecord = { 
                        name: studentInfo.name || "神秘挑戰者", 
                        className: studentInfo.className || "",
                        number: studentInfo.number || "",
                        N: prevState.N, 
                        level: currentLevel, 
                        levelName: config.name,
                        mode: modeLabel, 
                        time: timer, 
                        steps: steps + 1, 
                        hintCount: prevState.hintCount,
                        date: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    
                    const updatedLeaderboard = [...leaderboard, newRecord]
                        .sort((a, b) => {
                            if (a.level !== b.level) return b.level - a.level;
                            if (a.hintCount !== b.hintCount) return a.hintCount - b.hintCount;
                            return a.time - b.time;
                        });
                    setLeaderboard(updatedLeaderboard);
                    localStorage.setItem('whirlwindLeaderboard', JSON.stringify(updatedLeaderboard));
                }
                return { ...prevState, board: currentBoard, won: isWon };
            };

            const handleDragStart = (e, id) => {
                if (isTouchDevice) {
                    e.preventDefault();
                    return;
                }
                triggerStartAction();
                e.dataTransfer.setData("domId", id);
                e.dataTransfer.effectAllowed = "move";
                setGameState(prev => ({ ...prev, selectedId: null })); 
                setSelectedBoardSlot(null);
            };

            const handleDropOnSlot = (e, targetSlotId) => {
                e.preventDefault(); e.stopPropagation();
                setDragOverSlot(null);
                triggerStartAction();
                if (gameState.won) return;
                
                const dragId = e.dataTransfer.getData("domId");
                if (!dragId) return;

                setGameState(prev => {
                    const newBoard = { ...prev.board };
                    let sourceSlotId = null;

                    Object.keys(newBoard).forEach(key => {
                        if (newBoard[key]?.id === dragId) sourceSlotId = key;
                    });

                    const targetExistingCard = newBoard[targetSlotId];

                    if (sourceSlotId) {
                        newBoard[sourceSlotId] = targetExistingCard;
                        newBoard[targetSlotId] = prev.board[sourceSlotId];
                    } else {
                        Object.keys(newBoard).forEach(key => { if (newBoard[key]?.id === dragId) newBoard[key] = null; });
                        newBoard[targetSlotId] = { id: dragId, flipped: false };
                    }
                    
                    setSteps(s => s + 1);
                    return checkVictory({ ...prev, selectedId: null }, newBoard);
                });
            };

            // 全新核心邏輯：控制盤面上「點擊空位移動」、「點擊互相交換」、「點擊自己翻轉」
            const handleSlotClick = (slotId) => {
                triggerStartAction();
                if (gameState.won) return;

                setGameState(prev => {
                    const newBoard = { ...prev.board };
                    const clickedSlotCard = newBoard[slotId];

                    if (prev.selectedId) {
                        // 1. 若手牌區有選取 -> 放入該格子 (覆蓋舊牌)
                        Object.keys(newBoard).forEach(key => { if (newBoard[key]?.id === prev.selectedId) newBoard[key] = null; });
                        newBoard[slotId] = { id: prev.selectedId, flipped: false };
                        prev.selectedId = null;
                        setSelectedBoardSlot(null);
                        setSteps(s => s + 1);
                    } else if (selectedBoardSlot) {
                        // 2. 若盤面已有選取的牌
                        if (selectedBoardSlot === slotId) {
                            // 2a. 點同一張 -> 原地翻轉
                            newBoard[slotId] = { ...newBoard[slotId], flipped: !newBoard[slotId].flipped };
                            setSelectedBoardSlot(null);
                            setSteps(s => s + 1);
                        } else {
                            // 2b. 點另一張或空位 -> 互換或移動
                            const temp = newBoard[slotId];
                            newBoard[slotId] = newBoard[selectedBoardSlot];
                            newBoard[selectedBoardSlot] = temp;
                            setSelectedBoardSlot(null);
                            setSteps(s => s + 1);
                        }
                    } else {
                        // 3. 無任何選取，點擊有牌的格子 -> 選取該盤面的牌
                        if (newBoard[slotId]) {
                            setSelectedBoardSlot(slotId);
                        }
                    }
                    return checkVictory(prev, newBoard);
                });
            };

            const handleInventoryCardClick = (e, domId) => {
                e.stopPropagation(); 
                triggerStartAction();
                if (gameState.won) return;
                
                setGameState(prev => {
                    if (prev.selectedId === domId) {
                        return {
                            ...prev,
                            inventory: prev.inventory.map(d => d.id === domId ? { ...d, v1: d.v2, v2: d.v1 } : d),
                        };
                    }
                    setSelectedBoardSlot(null); // 取消盤面選取
                    return { ...prev, selectedId: domId };
                });
            };

            const handleInventoryContainerClick = (e) => {
                if (gameState.won) return;
                
                // 1. 如果盤面上有選取的牌 -> 取下收回
                if (selectedBoardSlot) {
                    setGameState(prev => {
                        const newBoard = { ...prev.board };
                        newBoard[selectedBoardSlot] = null; 
                        setSteps(s => s + 1);
                        return checkVictory(prev, newBoard);
                    });
                    setSelectedBoardSlot(null);
                }
                
                // 2. 取消手牌選取
                if (gameState.selectedId) {
                    setGameState(prev => ({ ...prev, selectedId: null }));
                }
            };

            const handleDropToInventory = (e) => {
                e.preventDefault(); e.stopPropagation();
                triggerStartAction();
                if (gameState.won) return;
                const dragId = e.dataTransfer.getData("domId");
                if (dragId && Object.values(gameState.board).some(s => s?.id === dragId)) {
                    setGameState(prev => {
                        const newBoard = { ...prev.board };
                        Object.keys(newBoard).forEach(k => { if (newBoard[k]?.id === dragId) newBoard[k] = null; });
                        setSteps(s => s + 1);
                        return checkVictory(prev, newBoard);
                    });
                }
            };

            const handleGetHint = () => {
                if (challengeMode !== 'free') return; 
                triggerStartAction();
                if (gameState.won) return;
                const { board, inventory, solutionMapping } = gameState;
                const incorrectSlotInfo = config.slots.find(s => {
                    const currentPlaced = board[s.id];
                    const correctVals = solutionMapping[s.id]; 
                    if (!currentPlaced) return true; 
                    const dom = inventory.find(d => d.id === currentPlaced.id);
                    const curV1 = currentPlaced.flipped ? dom.v2 : dom.v1;
                    const curV2 = currentPlaced.flipped ? dom.v1 : dom.v2;
                    return !(curV1 === correctVals[0] && curV2 === correctVals[1]);
                });
                if (!incorrectSlotInfo) return; 

                const targetSlotId = incorrectSlotInfo.id;
                const correctVals = solutionMapping[targetSlotId];
                const correctDom = inventory.find(d => (d.v1 === correctVals[0] && d.v2 === correctVals[1]) || (d.v1 === correctVals[1] && d.v2 === correctVals[0]));

                if (correctDom) {
                    setGameState(prev => {
                        const newBoard = { ...prev.board };
                        Object.keys(newBoard).forEach(key => { if (newBoard[key]?.id === correctDom.id) newBoard[key] = null; });
                        newBoard[targetSlotId] = { id: correctDom.id, flipped: correctDom.v1 !== correctVals[0] };
                        setSteps(s => s + 1);
                        setSelectedBoardSlot(null);
                        const nextState = checkVictory(prev, newBoard);
                        return { ...nextState, hintCount: prev.hintCount + 1, selectedId: null };
                    });
                }
            };

            const handleDownloadCertificate = async () => {
                if (!certRef.current) return;
                setCertBtnText("⏳ 正在產生證書...");
                try {
                    const canvas = await html2canvas(certRef.current, { scale: 2, backgroundColor: '#f8fafc', useCORS: true });
                    const link = document.createElement('a');
                    link.download = `榮譽證書_${studentInfo.name || '挑戰者'}_N${gameState.N}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    setCertBtnText("✅ 下載成功！");
                    setTimeout(() => setCertBtnText("🏅 下載過關榮譽證書"), 3000);
                } catch (error) { 
                    setCertBtnText("❌ 證書下載失敗，請重試");
                    setTimeout(() => setCertBtnText("🏅 下載過關榮譽證書"), 3000);
                }
            };

            const handleExportEmptyWorksheet = async () => {
                if (!printRef.current) return;
                setIsHideTimerForExport(true);
                setShowEmptyForExport(true);
                setTimeout(async () => {
                    try {
                        const canvas = await html2canvas(printRef.current, { scale: 2, backgroundColor: '#f8fafc' });
                        const link = document.createElement('a');
                        link.download = `旋風魔方陣_學習單_${config.name}_N${gameState.N}.jpg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                        link.click();
                    } catch(e){}
                    setIsHideTimerForExport(false);
                    setShowEmptyForExport(false);
                }, 100);
            };

            const filteredLeaderboard = useMemo(() => {
                return leaderboard.filter(item => {
                    const matchLevel = filterLevel === "all" || item.level === parseInt(filterLevel);
                    const matchMode = filterMode === "all" || item.mode.includes(filterMode);
                    return matchLevel && matchMode;
                });
            }, [leaderboard, filterLevel, filterMode]);

            const displayBoard = showEmptyForExport ? Object.fromEntries(Object.keys(board).map(k => [k, null])) : board;

            const matrixStatus = config.matrices.map(mat => {
                const T1 = getSlotValue(displayBoard, mat.top, 0), T2 = getSlotValue(displayBoard, mat.top, 1);
                const R1 = getSlotValue(displayBoard, mat.right, 0), R2 = getSlotValue(displayBoard, mat.right, 1);
                const B1 = getSlotValue(displayBoard, mat.bottom, 0), B2 = getSlotValue(displayBoard, mat.bottom, 1);
                const L1 = getSlotValue(displayBoard, mat.left, 0), L2 = getSlotValue(displayBoard, mat.left, 1);
                
                const sumTop = T1 + T2 + R1, sumRight = R1 + R2 + B2, sumBottom = B2 + B1 + L2, sumLeft = L2 + L1 + T1;
                
                return {
                    topState: displayBoard[mat.top] && displayBoard[mat.right] ? (sumTop === N ? 'green' : (sumTop > N ? 'red' : '')) : '',
                    rightState: displayBoard[mat.right] && displayBoard[mat.bottom] ? (sumRight === N ? 'green' : (sumRight > N ? 'red' : '')) : '',
                    bottomState: displayBoard[mat.bottom] && displayBoard[mat.left] ? (sumBottom === N ? 'green' : (sumBottom > N ? 'red' : '')) : '',
                    leftState: displayBoard[mat.left] && displayBoard[mat.top] ? (sumLeft === N ? 'green' : (sumLeft > N ? 'red' : '')) : ''
                };
            });

                let isRed = false, isGreen = false;
                matrixStatus.forEach((ms, i) => {
                    const mat = config.matrices[i];
                    if (mat.top === slotId) { if(ms.topState==='red') isRed=true; if(ms.topState==='green') isGreen=true; }
                    if (mat.right === slotId) { if(ms.rightState==='red') isRed=true; if(ms.rightState==='green') isGreen=true; }
                    if (mat.bottom === slotId) { if(ms.bottomState==='red') isRed=true; if(ms.bottomState==='green') isGreen=true; }
                    if (mat.left === slotId) { if(ms.leftState==='red') isRed=true; if(ms.leftState==='green') isGreen=true; }

                                                    {dom.v2}
                                                </div>

                                    {showClearConfirm ? "⚠️ 再次點擊確認清空 (3秒後取消)" : "🧹 清空所有歷史成績"}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 戰利品展示區 */}
                    {isOpenMode && collectedRecords.length > 0 && (
                        <div className="max-w-5xl mx-auto mt-6 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <h3 className="text-amber-400 font-bold text-lg mb-4 text-center">🏆 戰利品：已解鎖 {collectedRecords.length} 種不重複陣型</h3>
                            <div className="flex flex-wrap gap-6 justify-center">
                                {collectedRecords.map((rec, idx) => (
                                    <div key={idx} className="bg-white/10 p-4 rounded-2xl flex flex-col items-center shadow-sm">
                                        <div className="text-amber-300 text-xs font-bold mb-3">解法 {idx + 1} ({rec.steps}步 | 提示：{rec.hintCount}次)</div>
                                        <MiniBoard record={rec} config={LEVEL_CONFIGS[rec.level]} />
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 隱藏的證書畫布 */}
                    <div style={{ position: 'absolute', left: '-9999px', top: 0 }}>
                        <div ref={certRef} className="bg-white w-[900px] p-12 relative overflow-hidden border-[16px] border-amber-500" style={{ backgroundImage: 'radial-gradient(#fef3c7 2px, transparent 2px)', backgroundSize: '30px 30px' }}>
                            <div className="absolute inset-0 border-[8px] border-amber-200 m-2"></div>
                            <div className="relative z-10 text-center">
                                <div className="inline-block bg-amber-500 text-white px-8 py-2 rounded-full font-black text-2xl tracking-widest mb-6 shadow-md">旋風魔方陣 榮譽證明</div>
                                <h1 className="text-5xl font-black text-slate-800 mb-6 tracking-widest">{studentInfo.name || "挑戰者"}</h1>
                                
                                {(studentInfo.className || studentInfo.number) && (
                                    <p className="text-xl text-slate-600 font-bold mb-4">
                                        {studentInfo.className ? `${studentInfo.className} ` : ''} 
                                        {studentInfo.number ? `${studentInfo.number} 號` : ''}
                                    </p>
                                )}
                                
                                <p className="text-2xl text-slate-700 mb-8 font-bold leading-relaxed">
                                    成功解開 <span className="text-red-600 font-black px-2">{config.name}</span><br/>
                                    (目標各邊總和 N = <span className="text-red-600 font-black">{gameState?.N}</span>)
                                </p>
                                <p className="text-xl font-bold text-amber-700 mb-6">
                                    完成模式：{challengeMode === 'free' ? '🎲 自由隨機挑戰' : `📌 指定關卡題型 ${challengeMode}`} 
                                    ({isOpenMode ? "開放式提供28張" : "封閉式提供剛好張數"})
                                </p>
                                
                                <div className="flex justify-center gap-8 mb-10">
                                    <div className="bg-slate-100 px-6 py-3 rounded-2xl border-2 border-slate-200 shadow-sm">
                                        <div className="text-sm text-slate-500 font-bold mb-1">完成時間</div>
                                        <div className="text-2xl font-black text-slate-800">{Math.floor(timer/60)}分{timer%60}秒</div>
                                    </div>
                                    <div className="bg-slate-100 px-6 py-3 rounded-2xl border-2 border-slate-200 shadow-sm">
                                        <div className="text-sm text-slate-500 font-bold mb-1">總移動步數</div>
                                        <div className="text-2xl font-black text-slate-800">{steps} 步</div>
                                    </div>
                                    <div className="bg-slate-100 px-6 py-3 rounded-2xl border-2 border-slate-200 shadow-sm">
                                        <div className="text-sm text-slate-500 font-bold mb-1">使用電腦提示</div>
                                        {hintCount === 0 ? (
                                            <div className="text-xl font-black text-amber-600 tracking-wide animate-bounce">🥇 完美無瑕 (0次)</div>
                                        ) : (
                                            <div className="text-2xl font-black text-slate-800">{hintCount} 次</div>
                                        )}
                                    </div>
                                </div>

                                <div className="mt-6 border-t-2 border-dashed border-amber-300 pt-6">
                                    <h3 className="font-bold text-amber-700 mb-4 text-lg">
                                        {isOpenMode ? `本次挑戰共解開 ${collectedRecords.length} 種不重複陣型：` : '過關陣型：'}
                                    </h3>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 px-4 pb-12">
                                        {isOpenMode && collectedRecords.length > 0 ? (
                                            collectedRecords.map((rec, idx) => (
                                                <div key={idx} className="flex flex-col items-center w-[220px]">
                                                    <div className="text-sm font-bold text-amber-700 mb-2 bg-amber-100/80 px-3 py-0.5 rounded-full border border-amber-200">
                                                        解法 {idx + 1}
                                                    </div>
                                                    <MiniBoard record={rec} config={LEVEL_CONFIGS[rec.level]} />
                                                </div>
                                            ))
                                        ) : (
                                            <div className="w-[300px]">
                                                <MiniBoard record={{ board: gameState?.board, inventory: gameState?.inventory }} config={config} />
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="text-right mt-12 pr-6 pb-4">
                                    <p className="text-lg font-bold text-amber-800 mb-1">認證日期：{new Date().toLocaleDateString()}</p>
                                    <p className="text-xs text-amber-600/70">驗證碼：CYC-{Date.now().toString().slice(-6)}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
